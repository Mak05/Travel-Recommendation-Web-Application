<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - Travel Recommendation</title>
  <link rel="stylesheet" href="travel_recommendation.css">
</head>
<body>
  <nav class="navbar">
    <div class="logo">TravelBloom</div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About Us</a></li>
      <li><a href="contact.html">Contact Us</a></li>
    </ul>
  </nav>

  <main class="page-container">
    <section class="contact-section">
      <h1>CONTACT US</h1>
      <p>Have questions or feedback? Feel free to send us a message below.</p>
      <form id="contactForm" class="contact-form">
        <div class="form-group">
          <label for="name">Name:</label>
          <input type="text" id="name" required placeholder="Your Full Name">
        </div>
        <div class="form-group">
          <label for="email">Email:</label>
          <input type="email" id="email" required placeholder="Your Email Address">
        </div>
        <div class="form-group">
          <label for="message">Message:</label>
          <textarea id="message" rows="5" required placeholder="Type your message here..."></textarea>
        </div>
        <button type="submit" class="btn-submit">Submit</button>
      </form>
    </section>
  </main>

  <script>
    document.getElementById('contactForm')?.addEventListener('submit', function(e) {
      e.preventDefault();
      alert('Thank you for reaching out! Your message has been sent.');
      this.reset();
    });
  </script>
</body>
</html>
